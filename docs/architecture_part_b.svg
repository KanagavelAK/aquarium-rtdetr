<svg xmlns="http://www.w3.org/2000/svg" width="840" height="660" viewBox="0 0 840 660" role="img"><title>Part B: reasoning layer</title><desc>A question is routed by rules; if it needs the image the detector runs, the boxes become census facts (duplicates collapsed, crowding and label conflicts measured), a deterministic guardrail decides whether an honest answer exists, and only then are the facts phrased, by a language model if a key is set or by templates otherwise. Both refusal paths return the same JSON shape with reasons.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="840" height="660" fill="#FFFFFF"/><rect x="310" y="30" width="240" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/><text x="430.0" y="48" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#085041">POST /ask</text><text x="430.0" y="68" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#0F6E56">question + optional image</text><line x1="430" y1="86" x2="430" y2="116" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="310" y="120" width="240" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/><text x="430.0" y="138" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#3C3489">route()</text><text x="430.0" y="158" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#534AB7">rules: kind + target classes</text><path d="M310 148 L160 148 L160 206" fill="none" stroke="#888780" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/><rect x="40" y="210" width="240" height="56" rx="8" fill="#FBEAE5" stroke="#A32D2D" stroke-width="0.75"/><text x="160.0" y="228" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#7A1F1F">Detector not called</text><text x="160.0" y="248" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#A32D2D">off-image or out-of-scope</text><line x1="430" y1="176" x2="430" y2="206" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="310" y="210" width="240" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/><text x="430.0" y="228" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#3C3489">detector.predict()</text><text x="430.0" y="248" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#534AB7">RT-DETR boxes and scores</text><line x1="430" y1="266" x2="430" y2="296" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="310" y="300" width="240" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/><text x="430.0" y="318" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#3C3489">build_scene()</text><text x="430.0" y="338" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#534AB7">duplicates, crowding, conflicts, ranking</text><line x1="430" y1="356" x2="430" y2="386" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="310" y="390" width="240" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/><text x="430.0" y="408" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#3C3489">guardrail()</text><text x="430.0" y="428" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#534AB7">deterministic sufficiency check</text><path d="M310 418 L160 418 L160 476" fill="none" stroke="#888780" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/><rect x="40" y="480" width="240" height="56" rx="8" fill="#FBEAE5" stroke="#A32D2D" stroke-width="0.75"/><text x="160.0" y="498" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#7A1F1F">Insufficient information</text><text x="160.0" y="518" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#A32D2D">explicit refusal with reasons</text><line x1="430" y1="446" x2="430" y2="476" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="310" y="480" width="240" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/><text x="430.0" y="498" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#3C3489">compose()</text><text x="430.0" y="518" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#534AB7">LLM if key set, else template</text><line x1="430" y1="536" x2="430" y2="566" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="310" y="570" width="240" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/><text x="430.0" y="588" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#085041">JSON answer + evidence</text><text x="430.0" y="608" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#0F6E56">routing, reasons, source</text><path d="M160 536 L160 598 L306 598" fill="none" stroke="#888780" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/><path d="M40 238 L20 238 L20 598 L306 598" fill="none" stroke="#888780" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/><line x1="600" y1="140" x2="640" y2="140" stroke="#888780" stroke-width="1.5" stroke-dasharray="5 4"/><text x="648" y="140" dominant-baseline="central" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#5F5E5A">deterministic rule, no model</text><line x1="600" y1="164" x2="640" y2="164" stroke="#888780" stroke-width="1.5"/><text x="648" y="164" dominant-baseline="central" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#5F5E5A">model call</text><rect x="600" y="182" width="14" height="14" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/><text x="648" y="189" dominant-baseline="central" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#5F5E5A">request / response</text><rect x="600" y="206" width="14" height="14" rx="3" fill="#FBEAE5" stroke="#A32D2D" stroke-width="0.75"/><text x="648" y="213" dominant-baseline="central" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#5F5E5A">honest refusal</text></svg>