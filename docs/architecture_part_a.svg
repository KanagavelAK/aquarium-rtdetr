<svg xmlns="http://www.w3.org/2000/svg" width="680" height="620" viewBox="0 0 680 620" role="img"><title>Part A: detection pipeline</title><desc>The Kaggle mirror of Roboflow's Aquarium Combined dataset is deduplicated and split by md5, fine-tunes RT-DETR-L on two T4s, and the resulting weights feed both evaluation on the held-out test split and the /detect endpoint.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="680" height="620" fill="#FFFFFF"/><rect x="60" y="40" width="240" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/><text x="180.0" y="58" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#444441">Aquarium Combined (Kaggle)</text><text x="180.0" y="78" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#5F5E5A">638 images, YOLO, CC BY 4.0</text><line x1="180" y1="96" x2="180" y2="126" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="60" y="130" width="240" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/><text x="180.0" y="148" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#3C3489">prepare_data.py</text><text x="180.0" y="168" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#534AB7">dedup, md5 split 70/15/15</text><line x1="180" y1="186" x2="180" y2="216" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="60" y="220" width="240" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/><text x="180.0" y="238" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#3C3489">train.py</text><text x="180.0" y="258" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#534AB7">RT-DETR-L, AdamW, AMP, 2xT4 DDP</text><line x1="180" y1="276" x2="180" y2="306" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="60" y="310" width="240" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/><text x="180.0" y="328" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#085041">best.pt + training receipt</text><text x="180.0" y="348" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#0F6E56">weights, hardware, wall-clock</text><path d="M300 338 L340 338 L340 428 L376 428" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="380" y="400" width="240" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/><text x="500.0" y="418" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#3C3489">evaluate + failure_cases</text><text x="500.0" y="438" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#534AB7">val/test mAP, confusion, root causes</text><path d="M300 158 L500 158 L500 396" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/><text x="510" y="280" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#5F5E5A">held-out test split</text><line x1="180" y1="366" x2="180" y2="486" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="60" y="490" width="240" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/><text x="180.0" y="508" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#085041">POST /detect</text><text x="180.0" y="528" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#0F6E56">boxes, labels, confidences</text><rect x="60" y="580" width="14" height="14" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/><text x="82" y="587" dominant-baseline="central" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#5F5E5A">data</text><rect x="140" y="580" width="14" height="14" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/><text x="162" y="587" dominant-baseline="central" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#5F5E5A">scripts</text><rect x="241" y="580" width="14" height="14" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/><text x="263" y="587" dominant-baseline="central" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#5F5E5A">artifacts and serving</text></svg>